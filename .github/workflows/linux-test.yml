name: Test Live Linux Release Asset

on: [workflow_dispatch]

jobs:
  test-live-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Download Linux Asset From Latest Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "=== Downloading live .tar.gz asset from release ==="
        # The -R flag forces the CLI to look at your exact repo bypassing the .git check
        gh release download -R ${{ github.repository }} --pattern "acai-linux-x64.tar.gz" --clobber

    - name: Unpack and Execute Live Binary (Will crash if broken)
      run: |
        echo "=== Decompressing downloaded tarball ==="
        mkdir ./extracted-live-zone
        tar -xzvf acai-linux-x64.tar.gz -C ./extracted-live-zone
        
        echo "Checking directory structure..."
        ls -la ./extracted-live-zone/acai-linux-x64/demo
        ls -la ./extracted-live-zone/acai-linux-x64/src
        ls -la ./extracted-live-zone/acai-linux-x64/README.md
        
        cd ./extracted-live-zone/acai-linux-x64

        echo "=== Testing 'acai help' command ==="
        ./acai help || ./acai --help

        echo "=== Creating 'check.acai' test script ==="
        echo 'show "Hello World"' > check.acai
        cat check.acai

        echo "=== Executing 'acai check.acai' ==="
        OUTPUT=$(./acai check.acai)
        echo "Program Output: $OUTPUT"

        if echo "$OUTPUT" | grep -q "Hello World"; then
          echo "SUCCESS: 'Hello World' was successfully printed by the Acai engine!"
        else
          echo "ERROR: The program output did not contain 'Hello World'."
          exit 1
        fi
        echo "SUCCESS: All CLI command tests passed perfectly!"
