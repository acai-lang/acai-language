name: Build Acai macOS Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Compile Acai Mac Binary
      run: |
        dotnet publish -c Release -r osx-arm64 --self-contained true /p:PublishSingleFile=true -o ./dist/mac

    - name: Structure Installer Files
      run: |
        # 1. Create full system target directory structures
        mkdir -p ./pkg-root/usr/local/bin
        mkdir -p ./pkg-root/usr/local/share/Acai/docs
        mkdir -p ./pkg-root/usr/local/share/Acai/demo
        mkdir -p ./pkg-root/usr/local/share/Acai/src
        
        # 2. Copy the main executable and make it runnable
        cp ./dist/mac/Acai ./pkg-root/usr/local/bin/
        chmod +x ./pkg-root/usr/local/bin/Acai
        
        # 3. Copy top-level metadata files into the shared asset path
        [ -f "README.md" ] && cp README.md ./pkg-root/usr/local/share/Acai/ || echo "No README.md"
        [ -f "LICENSE" ]   && cp LICENSE ./pkg-root/usr/local/share/Acai/   || echo "No LICENSE"
        
        # 4. Safely copy asset folders recursively if they exist and are not empty
        [ -d "./docs" ] && [ "$(ls -A ./docs)" ] && cp -r ./docs/* ./pkg-root/usr/local/share/Acai/docs/ || echo "No docs files"
        [ -d "./demo" ] && [ "$(ls -A ./demo)" ] && cp -r ./demo/* ./pkg-root/usr/local/share/Acai/demo/ || echo "No demo files"
        [ -d "./src" ]  && [ "$(ls -A ./src)" ]  && cp -r ./src/* ./pkg-root/usr/local/share/Acai/src/   || echo "No src files"

    - name: Determine Version Tag
      id: get_version
      run: |
        TAG="${{ github.event.release.tag_name }}"
        if [ -z "$TAG" ]; then TAG="v0.1.0"; fi
        echo "version=$TAG" >> $GITHUB_OUTPUT

    - name: Build Native Mac .pkg Wizard
      run: |
        pkgbuild --root ./pkg-root \
                 --identifier com.acaiopensource.acai \
                 --version "${{ steps.get_version.outputs.version }}" \
                 --ownership recommended \
                 Acai-mac-arm64.pkg


    - name: Upload Mac PKG to Release
      uses: softprops/action-gh-release@v2
      with:
        files: Acai-mac-arm64.pkg
        tag_name: ${{ steps.get_version.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
