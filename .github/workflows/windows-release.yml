name: Build Acai windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Compile Acai Windows Binary
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:CopyOutputSymbolsToPublishDirectory=true -o ./bin/Release/net10.0/win-x64/publish

    - name: Determine Version Tag
      id: get_version
      shell: powershell
      run: |
        # Fallback dynamically to v0.2.0-beta.1 if run manually via workflow_dispatch
        $TAG = "${{ github.event.release.tag_name }}"
        if ([string]::IsNullOrEmpty($TAG)) { $TAG = "v0.2.0-beta.1" }
        
        # Clean up the string by removing any leading 'v' for the Inno Setup AppVersion directive
        $CLEAN_TAG = $TAG -replace '^v', ''
        
        echo "version_raw=$TAG" >> $env:GITHUB_OUTPUT
        echo "version_clean=$CLEAN_TAG" >> $env:GITHUB_OUTPUT

    - name: Generate Inno Setup Script
      shell: powershell
      run: |
        # Creates your specific .iss file dynamically with the correct runtime version embedded
        $issContent = @"
        [Setup]
        AppId=084AFCBE-FE9B-4AE6-A376-0798203AF227
        AppName=Acai
        AppVersion=${{ steps.get_version.outputs.version_clean }}
        AppPublisher=DeepIgnite
        DefaultDirName={autopf}\Acai
        DefaultGroupName=Acai 0.1
        OutputBaseFilename=Acai-windows-x64
        Compression=lzma
        SolidCompression=yes
        ChangesEnvironment=yes
        LicenseFile="LICENSE"

        ArchitecturesInstallIn64BitMode=x64compatible
        SetupIconFile=acai.ico
        UninstallDisplayIcon={app}\acai.ico
        UninstallDisplayName=Acai
        UninstallIconFile=acai.ico
        AppCopyright=Copyright © 2026 DeepIgnite

        [Files]
        ; 1. Grab the executable directly from your .NET build output folder
        Source: "bin\Release\net10.0\win-x64\publish\Acai.exe"; DestDir: "{app}"; Flags: ignoreversion
        Source: "bin\Release\net10.0\win-x64\publish\Acai.pdb"; DestDir: "{app}"; Flags: ignoreversion

        ; 2. Grab your docs, demos, and libs directly from your root project folders
        Source: "README.md"; DestDir: "{app}"; Flags: isreadme; Check: FileExists
        Source: "LICENSE"; DestDir: "{app}"; Flags: ignoreversion; Check: FileExists
        Source: "acai.ico"; DestDir: "{app}"; Flags: ignoreversion; Check: FileExists
        Source: "docs\*"; DestDir: "{app}\docs"; Flags: ignoreversion recursesubdirs createallsubdirs; Check: DirExists('docs')
        Source: "demo\*"; DestDir: "{app}\demo"; Flags: ignoreversion recursesubdirs createallsubdirs; Check: DirExists('demo')
        Source: "metadata\*"; DestDir: "{app}\metadata"; Flags: ignoreversion recursesubdirs createallsubdirs; Check: DirExists('metadata')

        [Registry]
        ; This block automatically adds your Program Files folder to the system PATH variable
        Root: HKCU; Subkey: "Environment"; ValueType: expandsz; ValueName: "Path"; ValueData: "{olddata};{app}"; Check: NeedsAddPath

        [Code]
        function FileExists(Param: String): Boolean;
        begin
          Result := FileExists(CurrentSourceFilename);
        end;

        function DirExists(DirName: String): Boolean;
        begin
          Result := DirExists(ExtractFilePath(CurrentSourceFilename) + DirName);
        end;

        function NeedsAddPath(): Boolean;
        var
          OldPath: String;
          AppPath: String;
          CleanOldPath: String;
          CleanAppPath: String;
        begin
          // Look up the current User PATH from Environment
          if RegQueryStringValue(HKEY_CURRENT_USER, 'Environment', 'Path', OldPath) then
          begin
            AppPath := ExpandConstant('{app}');
            
            // Step 1: Assign the original text values to our "Clean" string variables
            CleanAppPath := AppPath;
            CleanOldPath := OldPath;
            
            // Step 2: Run StringChange directly on the variables (it modifies them in place)
            StringChange(CleanAppPath, '\', '\\');
            StringChange(CleanOldPath, '\', '\\');
            
            // Step 3: Check if our clean path is already inside the system PATH
            if Pos(CleanAppPath, CleanOldPath) = 0 then
            begin
              Result := True;
            end
            else
            begin
              Result := False;
            end;
          end
          else
          begin
            // If the PATH variable doesn't exist at all, we definitely need to create it
            Result := True;
          end;
        end;
        "@
        Set-Content -Path "installer.iss" -Value $issContent

    - name: Compile Standalone Executable Setup Wizard
      shell: powershell
      run: |
        # Invokes the built-in Inno Setup compiler tool inside the windows-latest runner
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Upload Windows Installer Executable to Release
      uses: softprops/action-gh-release@v2
      with:
        files: Output/Acai-windows-x64.exe
        tag_name: ${{ steps.get_version.outputs.version_raw }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
